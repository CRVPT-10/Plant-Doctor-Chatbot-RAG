services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: plant-doctor-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # Must be filled securely inside the Render UI
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DEVICE
        value: cpu
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-base
    # Persistent Disks are not supported on Render Free Tier.
    # To enable persistent storage of uploaded manuals and metadata on a paid tier,
    # uncomment the block below:
    # disk:
    #   name: plant-doctor-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 10

  # 2. Streamlit Frontend Web Service
  - type: web
    name: plant-doctor-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: plant-doctor-backend
          property: host
