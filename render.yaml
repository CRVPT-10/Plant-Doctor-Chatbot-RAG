services:
  # Single web service: FastAPI backend that ALSO serves the static web/ UI
  # at its root (same origin -> no CORS, no cross-service URL wiring).
  - type: web
    name: plant-doctor-backend
    env: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # Must be filled securely inside the Render UI
      - key: GROQ_MODEL
        # llama-3.3-70b-versatile was retired by Groq on 2026-08-16.
        # Use a current Groq production model (gpt-oss-20b is a lighter/faster alt).
        value: openai/gpt-oss-120b
      - key: DEVICE
        value: cpu
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-base
      - key: RERANKER_ENABLED
        value: "false"
      - key: ASR_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.8"
    # Persistent Disks are not supported on Render Free Tier.
    # To enable persistent storage of uploaded manuals and metadata on a paid tier,
    # uncomment the block below:
    # disk:
    #   name: plant-doctor-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 10

  # The old Streamlit frontend service has been removed: the new vanilla web/ UI
  # is now served directly by the backend above at its root URL. You can delete
  # the "plant-doctor-frontend" service in the Render dashboard.
